services:
  nuxt:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_PUBLIC_DIRECTUS_BASE: ${NUXT_PUBLIC_DIRECTUS_BASE:-/api/d}
      NUXT_PUBLIC_N8N_BASE: ${NUXT_PUBLIC_N8N_BASE:-/api/n}
      NUXT_PUBLIC_DIRECTUS_VERIFY_URL: ${NUXT_PUBLIC_DIRECTUS_VERIFY_URL:-}
      DIRECTUS_UPSTREAM: ${DIRECTUS_UPSTREAM:-}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_BASE_URL: ${ROUTERAI_BASE_URL:-https://routerai.ru/api/v1}
      CARDGEN_CHAT_MODEL: ${CARDGEN_CHAT_MODEL:-openai/gpt-5.4}
      CARDGEN_IMAGE_MODEL: ${CARDGEN_IMAGE_MODEL:-google/gemini-2.5-flash-image}
      WORKER_HOST: "0.0.0.0"
      WORKER_PORT: "8766"
      MAX_UPLOAD_MB: "10"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    environment:
      DIRECTUS_UPSTREAM: ${DIRECTUS_UPSTREAM}
      N8N_UPSTREAM: ${N8N_UPSTREAM}
      WORKER_UPSTREAM: ${WORKER_UPSTREAM:-http://worker:8766}
    expose:
      - "80"
    depends_on:
      - nuxt
      - worker
    restart: unless-stopped
